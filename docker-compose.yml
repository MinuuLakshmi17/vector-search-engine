services:
  vector-search:
    build: .
    ports:
      - "8000:8000"
    environment:
      VECTOR_DIMENSION: "128"
      VECTOR_METRIC: cosine
      HNSW_M: "16"
      HNSW_EF_CONSTRUCTION: "200"
      HNSW_EF_SEARCH: "64"
      VECTOR_INDEX_PATH: /app/data/index.json
    volumes:
      - vector_data:/app/data
    restart: unless-stopped
volumes:
  vector_data:
