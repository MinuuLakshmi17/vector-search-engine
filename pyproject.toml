[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-search-engine"
version = "1.0.0"
description = "From-scratch HNSW approximate nearest-neighbor vector search service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
vector-search = "vector_search_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_search_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
